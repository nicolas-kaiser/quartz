[package]
name = "quartz-demo"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "JSON stdin/stdout bridge to Quartz, used by the Streamlit demo app"

[[bin]]
name = "quartz-demo"
path = "src/main.rs"

[dependencies]
quartz-core = { path = "../quartz-core" }
quartz-portfolio = { path = "../quartz-portfolio" }
quartz-solver = { path = "../quartz-solver" }
clarabel = { workspace = true }
serde = { workspace = true }
serde_json = "1"
