[package]
name = "quartz-portfolio"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Portfolio modeler and compiler for Quartz optimizer"

[dependencies]
clarabel = { workspace = true }
serde = { workspace = true }
quartz-core = { path = "../quartz-core" }
quartz-solver = { path = "../quartz-solver" }
rayon = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
osqp = ["quartz-solver/osqp"]

[[example]]
name = "backtest_warmstart"
required-features = ["osqp"]
