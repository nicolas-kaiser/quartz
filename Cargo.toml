[workspace]
members = [
    "crates/quartz-core",
    "crates/quartz-solver",
    "crates/quartz-portfolio",
    "crates/quartz-demo",
    "crates/quartz-python",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0"

[workspace.dependencies]
clarabel = "0.11"
serde = { version = "1", features = ["derive"] }
rayon = "1.10"
osqp = "1.0"
serde_json = "1"
serde_yaml = { package = "yaml_serde", version = "0.10" }
